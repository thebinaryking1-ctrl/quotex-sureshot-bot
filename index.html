<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUOTEX AI V11.0 | TOUCH FIXED</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --quotex-blue: #004fb4; --accent: #00e676; --dark-bg: #090d14; --card-bg: #151921; --border: #2a2e39; --sell: #ff3355; --buy: #00e676; --gold: #ffc107; }
        body { font-family: 'Inter', sans-serif; background: var(--dark-bg); color: #e0e0e0; margin: 0; padding: 0; text-align: center; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 600px; margin: auto; padding: 10px; }
        
        .header { padding: 10px 0; border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 16px; color: #fff; margin: 0; text-transform: uppercase; }

        #chart-box { width: 100%; height: 200px; background: #000; border: 1px solid var(--border); border-radius: 12px; margin: 10px 0; position: relative; z-index: 1; }

        .currency-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 8px; margin-bottom: 10px; position: relative; z-index: 2; }
        .currency-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; max-height: 120px; overflow-y: auto; padding: 5px; }
        
        .pair-card { 
            background: #090d14; 
            border: 1px solid var(--border); 
            padding: 8px 2px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 9px; 
            font-weight: bold; 
            color: #8b949e; 
            transition: 0.2s;
            pointer-events: auto; /* Touch fix */
        }
        .pair-card.active { border-color: var(--quotex-blue); background: rgba(0, 79, 180, 0.4); color: #fff; }

        /* Terminal Fixed */
        .terminal { background: #000; border: 2px solid var(--quotex-blue); border-radius: 20px; min-height: 250px; position: relative; margin-bottom: 15px; display: flex; flex-direction: column; justify-content: center; z-index: 10; }
        
        .lock-screen { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(9, 13, 20, 1); 
            z-index: 999; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            border-radius: 18px; 
            pointer-events: auto; /* Input fix */
        }

        input { 
            background: #1c212d; 
            border: 1px solid var(--border); 
            color: #fff; 
            padding: 15px; 
            width: 75%; 
            border-radius: 8px; 
            text-align: center; 
            margin-bottom: 12px; 
            font-size: 16px; 
            outline: none;
            pointer-events: auto;
        }

        #sigBox { width: 100%; transition: 0.3s; }
        .timer-row { font-family: monospace; color: var(--gold); font-size: 24px; font-weight: bold; }
        #signalDir { font-size: 38px; font-weight: 900; margin: 10px 0; }
        #accuracy { font-size: 13px; color: var(--gold); font-weight: bold; }

        .btn { display: block; width: 100%; margin: 8px 0; padding: 14px; border-radius: 10px; text-decoration: none; font-weight: 800; font-size: 13px; cursor: pointer; border: none; text-align: center; color: white; pointer-events: auto; }
        .btn-blue { background: var(--quotex-blue); }

        .rules-section { background: #1c212d; border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: left; }
        .rule-item { font-size: 11px; margin-bottom: 5px; color: #c9d1d9; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1>QUOTEX <span>PRO V11.0</span></h1></div>

    <div id="chart-box"></div>

    <div class="currency-box">
        <div class="currency-grid" id="pairGrid">
            <div class="pair-card active" onclick="changePair(this, 'EURUSD')">EUR/USD</div>
            <div class="pair-card" onclick="changePair(this, 'GBPUSD')">GBP/USD</div>
            <div class="pair-card" onclick="changePair(this, 'USDJPY')">USD/JPY</div>
            <div class="pair-card" onclick="changePair(this, 'AUDUSD')">AUD/USD</div>
            <div class="pair-card" onclick="changePair(this, 'BTCUSDT')">BTC/USDT</div>
            <div class="pair-card" onclick="changePair(this, 'ETHUSDT')">ETH/USDT</div>
            <div class="pair-card" onclick="changePair(this, 'SOLUSDT')">SOL/USDT</div>
            <div class="pair-card" onclick="changePair(this, 'XRPUSDT')">XRP/USDT</div>
        </div>
    </div>

    <div class="terminal">
