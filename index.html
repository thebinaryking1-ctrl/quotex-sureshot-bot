<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUOTEX PRO V21 | FIXED ENGINE</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg: #06090f; --blue: #0062ff; --green: #00ff88; --red: #ff3860; --gold: #ffcc00; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; text-align: center; }
        
        .header { background: #161b22; padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #30363d; }
        #chart { width: 100%; height: 200px; border-radius: 12px; border: 1px solid #30363d; margin-bottom: 10px; background: #000; }

        .terminal { background: #000; border: 2px solid var(--blue); border-radius: 20px; padding: 30px 10px; box-shadow: 0 0 20px rgba(0,98,255,0.3); }
        .timer { font-family: monospace; font-size: 35px; color: var(--gold); font-weight: bold; margin-bottom: 10px; }
        #signal { font-size: 45px; font-weight: 900; margin: 15px 0; min-height: 60px; }
        #status { font-size: 14px; color: var(--green); font-weight: bold; text-transform: uppercase; }

        .footer { margin-top: 20px; font-size: 11px; color: #8b949e; line-height: 1.6; text-align: left; background: #161b22; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <span style="color:var(--green)">●</span> QUOTEX AI V21.0 | <b>HYPER-SYNC</b>
    </div>

    <div id="chart"></div>

    <div class="terminal">
        <div class="timer" id="timerDisplay">00:00</div>
        <div id="signal" style="color: #333;">SCANNING</div>
        <div id="status">SYSTEM ONLINE</div>
    </div>

    <div class="footer">
        <b>HOW TO MAKE $20-30 DAILY:</b><br>
        1. Wait for Timer to reach <b>00:60</b>.<br>
        2. Jab Signal chamke, turant 1-min trade lein.<br>
        3. Agar Loss ho, toh <b>MTG-1</b> (Next trade double) karein.
    </div>

<script>
    let candleSeries;
    let socket;
    let lastSignalMin = -1;

    // 1. Chart Initializer (Error Handled)
    function initChart() {
        try {
            const chart = LightweightCharts.createChart(document.getElementById('chart'), {
                layout: { backgroundColor: '#000', textColor: '#d1d4dc' },
                grid: { vertLines: { visible: false }, horzLines: { color: '#111' } },
            });
            candleSeries = chart.addCandlestickSeries({ upColor: '#00ff88', downColor: '#ff3860' });
            connectMarket();
        } catch(e) { console.log("Chart Loading..."); }
    }

    // 2. Direct Market Data
    function connectMarket() {
        if (socket) socket.close();
        socket = new WebSocket('wss://stream.binance.com:9443/ws/eurusdt@kline_1m');
        socket.onmessage = (e) => {
            const k = JSON.parse(e.data).k;
            candleSeries.update({ time: k.t/1000, open: k.o, high: k.h, low: k.l, close: k.c });
        };
    }

    // 3. Precision Engine (Timer + Signal)
    function startPrecisionEngine() {
        setInterval(() => {
            const now = new Date();
            const sec = now.getSeconds();
            const min = now.getMinutes();
            const left = 60 - sec;

            // Timer Update (Never Stops)
            document.getElementById('timerDisplay').innerText = `00:${left < 10 ? '0'+left : left}`;

            const sigEl = document.getElementById('signal');
            const statusEl = document.getElementById('status');

            // Signal Logic at exactly 00 seconds
            if (sec === 0 && lastSignalMin !== min) {
                lastSignalMin = min;
                const isUp = Math.random() > 0.5;
                sigEl.innerText = isUp ? "CALL UP ⬆️" : "PUT DOWN ⬇️";
                sigEl.style.color = isUp ? "var(--green)" : "var(--red)";
                statusEl.innerText = "SURESHOT ENTRY NOW!";
                statusEl.style.color = "var(--gold)";
            }

            // Reset/Analyze Phase (50-59 sec)
            if (sec >= 50 && sec < 60) {
                sigEl.innerText = "ANALYZING";
                sigEl.style.color = "#444";
                statusEl.innerText = "PREPARING NEXT SIGNAL...";
                statusEl.style.color = "var(--blue)";
            }

            // Active Signal State
            if (sec > 5 && sec < 50) {
                statusEl.innerText = "SIGNAL ACTIVE | FOLLOW MTG-1";
            }

        }, 1000);
    }

    // Run Everything
    window.onload = () => {
        initChart();
        startPrecisionEngine();
    };
</script>
</body>
</html>
