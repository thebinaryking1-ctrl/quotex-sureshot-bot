<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUOTEX LIVE ENGINE V17.0</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg: #090d14; --blue: #005cff; --green: #00ff88; --red: #ff3860; --gold: #ffcc00; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; text-align: center; }
        
        /* Layout Improvements */
        .status-header { background: #151921; padding: 8px; border-radius: 8px; font-size: 11px; border: 1px solid #2a2e39; margin-bottom: 10px; display: flex; justify-content: space-between; }
        #chart { width: 100%; height: 180px; border-radius: 12px; border: 1px solid #2a2e39; margin-bottom: 10px; }

        .currency-box { background: #151921; border-radius: 12px; padding: 10px; margin-bottom: 15px; }
        .currency-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; max-height: 90px; overflow-y: auto; }
        .pair-btn { background: #090d14; border: 1px solid #2a2e39; padding: 10px 2px; border-radius: 5px; font-size: 9px; cursor: pointer; color: #8b949e; }
        .pair-btn.active { border-color: var(--blue); background: rgba(0, 92, 255, 0.2); color: #fff; }

        /* Terminal Display - BIG & CLEAR */
        .signal-box { background: #000; border: 2px solid var(--blue); border-radius: 25px; padding: 30px 10px; position: relative; box-shadow: 0 0 20px rgba(0, 92, 255, 0.4); }
        .timer-display { font-family: 'Courier New', monospace; font-size: 32px; color: var(--gold); font-weight: bold; margin-bottom: 10px; }
        #signalText { font-size: 48px; font-weight: 900; min-height: 60px; margin: 10px 0; text-transform: uppercase; }
        #accText { font-size: 14px; font-weight: bold; color: var(--green); letter-spacing: 1px; }

        .footer { font-size: 10px; margin-top: 15px; color: #555; }
    </style>
</head>
<body>

    <div class="status-header">
        <span>ENGINE: <b id="engineStatus" style="color:var(--green)">RUNNING</b></span>
        <span>PAIR: <b id="pairTitle" style="color:var(--gold)">EURUSD</b></span>
    </div>

    <div id="chart"></div>

    <div class="currency-box">
        <div class="currency-grid">
            <div class="pair-btn active" onclick="changePair(this, 'EURUSD')">EUR/USD</div>
            <div class="pair-btn" onclick="changePair(this, 'GBPUSD')">GBP/USD</div>
            <div class="pair-btn" onclick="changePair(this, 'USDJPY')">USD/JPY</div>
            <div class="pair-btn" onclick="changePair(this, 'AUDUSD')">AUD/USD</div>
            <div class="pair-btn" onclick="changePair(this, 'BTCUSDT')">BTC/USDT</div>
            <div class="pair-btn" onclick="changePair(this, 'ETHUSDT')">ETH/USDT</div>
        </div>
    </div>

    <div class="signal-box">
        <div class="timer-display" id="timer">00:00</div>
        <div id="signalText" style="color: #333;">SCANNING</div>
        <div id="accText">WAITING FOR NEXT CANDLE</div>
    </div>

    <div class="footer">QUOTEX VIP ENGINE V17.0 | NO-DELAY SYNC</div>

<script>
    let socket;
    let candleSeries;
    let currentPair = 'EURUSD';
    let lastProcessedMinute = -1;

    // 1. Chart Setup
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
        layout: { backgroundColor: '#000', textColor: '#d1d4dc' },
        grid: { vertLines: { visible: false }, horzLines: { color: '#111' } },
    });
    candleSeries = chart.addCandlestickSeries({ upColor: '#00ff88', downColor: '#ff3860' });

    // 2. Market Data
    function startMarket(pair) {
        if (socket) socket.close();
        socket = new WebSocket(`wss://stream.binance.com:9443/ws/${pair.toLowerCase()}@kline_1m`);
        socket.onmessage = (e) => {
            const k = JSON.parse(e.data).k;
            candleSeries.update({ time: k.t/1000, open: k.o, high: k.h, low: k.l, close: k.c });
        };
        document.getElementById('pairTitle').innerText = pair;
    }

    function changePair(el, pair) {
        document.querySelectorAll('.pair-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        startMarket(pair);
    }

    // 3. FAST SIGNAL ENGINE (Check every 100ms)
    function runHyperEngine() {
        const now = new Date();
        const sec = now.getSeconds();
        const min = now.getMinutes();
        const left = 60 - sec;
        
        const timerEl = document.getElementById('timer');
        const sigEl = document.getElementById('signalText');
        const accEl = document.getElementById('accText');

        // Real-time Timer Update
        timerEl.innerText = `00:${left < 10 ? '0' + left : left}`;

        // Exact Signal Trigger at 00 Seconds
        if (sec === 0 && lastProcessedMinute !== min) {
            lastProcessedMinute = min; // Avoid duplicate signals in same second
            const isCall = Math.random() > 0.5;
            
            sigEl.innerText = isCall ? "CALL UP ⬆️" : "PUT DOWN ⬇️";
            sigEl.style.color = isCall ? "var(--green)" : "var(--red)";
            accEl.innerText = "SURESHOT 99% (MTG-1 READY)";
            
            // Background color flash effect for alert
            document.querySelector('.signal-box').style.borderColor = isCall ? "var(--green)" : "var(--red)";
        } 
        
        // Preparation Phase
        else if (sec >= 50 && sec <= 59) {
            sigEl.innerText = "CHECKING...";
            sigEl.style.color = "var(--gold)";
            accEl.innerText = "CALCULATING NEXT SIGNAL";
            document.querySelector('.signal-box').style.borderColor = "var(--blue)";
        }

        // Active State
        else if (sec > 5 && sec < 50) {
            accEl.innerText = "SIGNAL ACTIVE | WAIT FOR 00s";
        }
    }

    // Initial Start
    startMarket(currentPair);
    // Interval set to 100ms for perfect sync
    setInterval(runHyperEngine, 100;
</script>
</body>
</html>
