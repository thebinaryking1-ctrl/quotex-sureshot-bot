<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUOTEX ULTRA V16.0 | NO-DELAY</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg: #05070a; --blue: #005cff; --green: #00ff88; --red: #ff3860; --gold: #ffcc00; --border: #1e222d; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; text-align: center; }
        
        .header { font-size: 14px; font-weight: 900; margin: 10px 0; color: var(--blue); letter-spacing: 2px; }
        #chart { width: 100%; height: 180px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; background: #000; }

        .currency-box { background: #0d1117; border: 1px solid var(--border); border-radius: 12px; padding: 8px; margin-bottom: 15px; }
        .currency-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-height: 100px; overflow-y: auto; padding: 5px; }
        .pair-card { background: #161b22; border: 1px solid #30363d; padding: 10px 2px; border-radius: 6px; cursor: pointer; font-size: 9px; font-weight: bold; color: #8b949e; }
        .pair-card.active { border-color: var(--blue); background: rgba(0, 92, 255, 0.2); color: #fff; box-shadow: 0 0 10px rgba(0,92,255,0.3); }

        .terminal { background: #000; border: 2px solid var(--blue); border-radius: 25px; padding: 25px; position: relative; overflow: hidden; }
        .timer { font-family: 'Courier New', monospace; font-size: 35px; color: var(--gold); font-weight: bold; }
        #signal { font-size: 42px; font-weight: 900; margin: 15px 0; min-height: 60px; text-shadow: 0 0 20px rgba(255,255,255,0.1); }
        #accuracy { font-size: 14px; color: var(--green); font-weight: bold; text-transform: uppercase; }

        .footer-rules { background: #0d1117; padding: 10px; border-radius: 10px; margin-top: 15px; text-align: left; font-size: 11px; border-left: 4px solid var(--gold); }
    </style>
</head>
<body>

    <div class="header">● QUOTEX ULTRA SYNC V16.0</div>
    <div id="chart"></div>

    <div class="currency-box">
        <div class="currency-grid">
            <div class="pair-card active" onclick="changePair(this, 'EURUSD')">EUR/USD</div>
            <div class="pair-card" onclick="changePair(this, 'GBPUSD')">GBP/USD</div>
            <div class="pair-card" onclick="changePair(this, 'USDJPY')">USD/JPY</div>
            <div class="pair-card" onclick="changePair(this, 'AUDUSD')">AUD/USD</div>
            <div class="pair-card" onclick="changePair(this, 'BTCUSDT')">BTC/USDT</div>
            <div class="pair-card" onclick="changePair(this, 'ETHUSDT')">ETH/USDT</div>
            <div class="pair-card" onclick="changePair(this, 'SOLUSDT')">SOL/USDT</div>
            <div class="pair-card" onclick="changePair(this, 'USDCAD')">USD/CAD</div>
        </div>
    </div>

    <div class="terminal">
        <div class="timer" id="timer">00:00</div>
        <div id="signal" style="color: #333;">SCANNING</div>
        <div id="accuracy">SYSTEM READY</div>
        <div style="font-size: 9px; color: #555; margin-top: 10px;">V16 ENGINE | ANTI-LAG ACTIVE</div>
    </div>

    <div class="footer-rules">
        <b>VIP PROTOCOL:</b><br>
        1. 00:60 hote hi Quotex mein trade lagayein.<br>
        2. Signal fail hone par <b>MTG-1</b> (Double Amount) use karein.
    </div>

<script>
    let currentPair = 'EURUSD';
    let socket;
    let candleSeries;

    // 1. Chart Initializer
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
        layout: { backgroundColor: '#000', textColor: '#d1d4dc' },
        grid: { vertLines: { visible: false }, horzLines: { color: '#111' } },
    });
    candleSeries = chart.addCandlestickSeries({ upColor: '#00ff88', downColor: '#ff3860' });

    // 2. WebSocket Fix (Connects immediately)
    function startData(pair) {
        if (socket) socket.close();
        socket = new WebSocket(`wss://stream.binance.com:9443/ws/${pair.toLowerCase()}@kline_1m`);
        socket.onmessage = (e) => {
            const k = JSON.parse(e.data).k;
            candleSeries.update({ time: k.t / 1000, open: k.o, high: k.h, low: k.l, close: k.c });
        };
    }

    function changePair(el, pair) {
        document.querySelectorAll('.pair-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentPair = pair;
        startData(pair);
    }

    // 3. Forced Signal Engine (Will never freeze)
    function startEngine() {
        setInterval(() => {
            const now = new Date();
            const sec = now.getSeconds();
            const ms = now.getMilliseconds();
            const left = 60 - sec;
            
            // Timer Display Update
            document.getElementById('timer').innerText = `00:${left < 10 ? '0' + left : left}`;

            const sigEl = document.getElementById('signal');
            const accEl = document.getElementById('accuracy');

            // Signal Logic - Har minute ke 00 second par 100% trigger
            if (sec === 0) {
                // Algorithm Analysis Simulation
                const power = Math.random();
                if (power > 0.5) {
                    sigEl.innerText = "CALL UP ⬆️";
                    sigEl.style.color = "var(--green)";
                    accEl.innerText = "SURESHOT WIN (99%)";
                } else {
                    sigEl.innerText = "PUT DOWN ⬇️";
                    sigEl.style.color = "var(--red)";
                    accEl.innerText = "SURESHOT WIN (97%)";
                }
            } 
            
            // Preparation Phase (50-59 sec)
            else if (sec >= 50 && sec < 60) {
                sigEl.innerText = "WAITING...";
                sigEl.style.color = "var(--gold)";
                accEl.innerText = "PREPARING NEXT SIGNAL";
                accEl.style.color = "#8b949e";
            }

            // Normal State
            else if (sec > 0 && sec < 50) {
                accEl.style.color = "var(--green)";
            }

        }, 1000);
    }

    // Initialize
    startData(currentPair);
    startEngine();
</script>
</body>
</html>
