<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUOTEX AI V14.0 | ANTI-FREEZE</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg: #090d14; --blue: #004fb4; --green: #00e676; --red: #ff3355; --gold: #ffc107; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; text-align: center; }
        
        .status-bar { background: #151921; padding: 10px; border-radius: 10px; border: 1px solid #2a2e39; margin-bottom: 10px; font-size: 11px; }
        .live-dot { height: 8px; width: 8px; background: var(--green); border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        #chart { width: 100%; height: 220px; border-radius: 12px; border: 1px solid #2a2e39; margin-bottom: 10px; }

        .terminal { background: #000; border: 2px solid var(--blue); border-radius: 20px; padding: 25px; position: relative; box-shadow: 0 0 20px rgba(0,79,180,0.3); }
        .countdown { font-family: monospace; font-size: 32px; color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        #signal { font-size: 40px; font-weight: 900; margin: 15px 0; letter-spacing: 2px; }
        #accuracy { font-size: 14px; color: #8b949e; font-weight: bold; }

        .btn-tg { display: block; background: #229ED9; color: white; text-decoration: none; padding: 15px; border-radius: 10px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="status-bar">
        <span class="live-dot"></span> CONNECTION: <b id="connStatus" style="color:var(--green)">SYNCED</b> | V14.0 ANTI-FREEZE
    </div>

    <div id="chart"></div>

    <div class="terminal">
        <div class="countdown" id="timer">00:00</div>
        <div id="signal" style="color: #444;">INITIALIZING...</div>
        <div id="accuracy">READY TO ANALYZE</div>
        
        <div style="margin-top: 15px; font-size: 10px; color: var(--gold);">
            AUTO-SYNC ENABLED (1M CANDLE)
        </div>
    </div>

    <a href="https://t.me/Quotextrader004" class="btn-tg">GET VIP KEY - TELEGRAM</a>

    <audio id="sigSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
    let candleSeries;
    let socket;
    const sigSound = document.getElementById('sigSound');

    // Chart Setup
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
        layout: { backgroundColor: '#090d14', textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#131722' }, horzLines: { color: '#131722' } },
    });
    candleSeries = chart.addCandlestickSeries({ upColor: '#00e676', downColor: '#ff3355' });

    // Anti-Freeze WebSocket Connection
    function startStream() {
        if (socket) socket.close();
        socket = new WebSocket('wss://stream.binance.com:9443/ws/eurusdt@kline_1m');
        
        socket.onmessage = (e) => {
            const k = JSON.parse(e.data).k;
            candleSeries.update({
                time: k.t / 1000, open: k.o, high: k.h, low: k.l, close: k.c
            });
            document.getElementById('connStatus').innerText = "LIVE";
        };

        socket.onclose = () => {
            document.getElementById('connStatus').innerText = "RECONNECTING...";
            setTimeout(startStream, 2000);
        };
    }

    // Main Logic Loop (Run every second)
    setInterval(() => {
        const now = new Date();
        const sec = now.getSeconds();
        const left = 60 - sec;
        
        // Update Timer Display
        document.getElementById('timer').innerText = `00:${left < 10 ? '0' + left : left}`;

        const sigEl = document.getElementById('signal');
        const accEl = document.getElementById('accuracy');

        // Signal Logic - Exact Start of Candle
        if (sec === 0) {
            const isCall = Math.random() > 0.5;
            sigEl.innerText = isCall ? "CALL UP ⬆️" : "PUT DOWN ⬇️";
            sigEl.style.color = isCall ? "var(--green)" : "var(--red)";
            accEl.innerText = "SURESHOT 99% (ENTRY NOW)";
            accEl.style.color = "var(--gold)";
            
            // Play Sound
            sigSound.play().catch(e => console.log("Sound enabled after interaction"));
        } 
        
        // Clearing Signal after 50 seconds to prepare for next
        if (sec === 50) {
            sigEl.innerText = "ANALYZING...";
            sigEl.style.color = "var(--gold)";
            accEl.innerText = "GET READY FOR NEXT CANDLE";
            accEl.style.color = "#8b949e";
        }

        // Keep connection alive
        if (sec % 30 === 0 && socket.readyState !== WebSocket.OPEN) {
            startStream();
        }

    }, 1000);

    // Start everything
    startStream();
</script>
</body>
</html>
