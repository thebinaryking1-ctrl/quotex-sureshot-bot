
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAUTAM CHAUHAN | PRO AI TERMINAL</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --gold: #f0b90b; --accent: #00ff88; --dark-bg: #0d1117; --card-bg: rgba(22, 27, 34, 0.9); --border: #30363d; --sell: #ff4a4a; --buy: #00ff88; }
        body { font-family: 'Inter', sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 0; text-align: center; }
        .container { max-width: 600px; margin: auto; padding: 15px; }
        .header h1 { color: white; font-size: 20px; margin: 15px 0; font-weight: 800; text-transform: uppercase; }
        
        /* Professional Chart Area */
        #chart-box { width: 100%; height: 280px; background: #000; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; }

        .currency-box { background: #1c2128; border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 15px; }
        .currency-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .pair-card { background: #0d1117; border: 1px solid var(--border); padding: 8px 2px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold; color: #fff; }
        .pair-card.active { border-color: var(--gold); background: rgba(240, 185, 11, 0.1); color: var(--gold); }

        .terminal { background: #000; border: 2px solid var(--gold); border-radius: 20px; min-height: 280px; margin-bottom: 20px; position: relative; display: flex; flex-direction: column; justify-content: center; }
        
        /* Indicators Panel */
        .indicator-panel { display: flex; justify-content: space-around; padding: 10px; font-size: 11px; background: #161b22; border-radius: 10px; margin: 10px; border: 1px solid #333; }
        .ind-item { color: #8b949e; }
        .ind-val { color: var(--accent); font-weight: bold; }

        #signalDir { font-size: 40px; font-weight: 900; margin: 10px 0; }
        #accuracy { font-size: 14px; color: var(--gold); margin-bottom: 5px; }
        
        .btn { display: block; width: 100%; margin: 10px 0; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: 800; font-size: 14px; cursor: pointer; border: none; text-align: center; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-blue { background: #229ED9; color: #fff; }

        .lock-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.98); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 18px; }
        input { background: #161b22; border: 1px solid var(--border); color: #fff; padding: 15px; width: 80%; border-radius: 12px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1>GAUTAM CHAUHAN | AI V4.0</h1></div>

    <div id="chart-box"></div>

    <div class="currency-box">
        <div class="currency-grid">
            <div class="pair-card active" onclick="changePair('BTCUSDT')">BTC/USDT</div>
            <div class="pair-card" onclick="changePair('ETHUSDT')">ETH/USDT</div>
            <div class="pair-card" onclick="changePair('EURUSD')">EUR/USD</div>
        </div>
    </div>

    <div class="terminal">
        <div id="lockUI" class="lock-screen">
            <p style="font-weight: 800;">🔒 VIP ENCRYPTED TERMINAL</p>
            <input type="password" id="pass" placeholder="Enter VIP License Key">
            <button class="btn btn-gold" style="width:80%" onclick="unlock()">ACTIVATE STRONG SIGNALS</button>
        </div>

        <div id="sigBox" style="filter: blur(20px);">
            <div class="indicator-panel">
                <div class="ind-item">RSI (14): <span class="ind-val" id="rsiVal">--</span></div>
                <div class="ind-item">EMA (20): <span class="ind-val" id="emaVal">--</span></div>
                <div class="ind-item">VOL: <span class="ind-val">STRONG</span></div>
            </div>
            
            <div id="accuracy">ANALYZING MARKET...</div>
            <div id="signalDir">WAITING</div>
            <div id="status" style="font-size: 12px; color: #8b949e;">CONNECTED TO REAL-TIME SERVER</div>
        </div>
    </div>

    <a href="https://t.me/Quotextrader004" class="btn btn-blue">GET VIP KEY ON TELEGRAM</a>
</div>

<script>
    let currentPair = 'BTCUSDT';
    let socket;
    const chart = LightweightCharts.createChart(document.getElementById('chart-box'), {
        layout: { backgroundColor: '#000', textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#131722' }, horzLines: { color: '#131722' } },
    });
    const candleSeries = chart.addCandlestickSeries();

    // 1. Connect to Real Binance Market Data
    function connectStream(pair) {
        if (socket) socket.close();
        socket = new WebSocket(`wss://stream.binance.com:9443/ws/${pair.toLowerCase()}@kline_1m`);
        
        socket.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            const candle = msg.k;
            const price = parseFloat(candle.c);
            
            candleSeries.update({
                time: candle.t / 1000,
                open: parseFloat(candle.o),
                high: parseFloat(candle.h),
                low: parseFloat(candle.l),
                close: price
            });

            analyzeMarket(price);
        };
    }

    // 2. Strong Signal Analysis Logic (RSI + EMA Simulation)
    function analyzeMarket(currentPrice) {
        // Real logic simulation for "Strong" feel
        const rsi = Math.floor(Math.random() * (75 - 25) + 25);
        document.getElementById('rsiVal').innerText = rsi;
        document.getElementById('emaVal').innerText = currentPrice > (currentPrice - 2) ? "BULLISH" : "BEARISH";

        const sig = document.getElementById('signalDir');
        const acc = document.getElementById('accuracy');

        // Strong Criteria: RSI must be extreme
        if (rsi > 65) {
            sig.innerText = "PUT DOWN ⬇️";
            sig.style.color = "var(--sell)";
            acc.innerText = "CONFIDENCE: 92% (STRONG)";
        } else if (rsi < 35) {
            sig.innerText = "CALL UP ⬆️";
            sig.style.color = "var(--buy)";
            acc.innerText = "CONFIDENCE: 94% (STRONG)";
        } else {
            sig.innerText = "SCANNING...";
            sig.style.color = "#8b949e";
            acc.innerText = "WAITING FOR STRONG REVERSAL";
        }
    }

    function changePair(p) {
        currentPair = p;
        document.querySelectorAll('.pair-card').forEach(c => c.classList.remove('active'));
        connectStream(p);
    }

    function unlock() {
        if(document.getElementById('pass').value === "GautamVIP02") {
            document.getElementById('lockUI').style.display = 'none';
            document.getElementById('sigBox').style.filter = 'none';
        } else { alert("Verification Failed!"); }
    }

    connectStream(currentPair);
</script>
</body>
</html>
